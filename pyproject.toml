[project]
name = "hh-mcp"
version = "0.3.2"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.11",
    "httpx2[http2]>=0.0.1",
    "markitdown>=0.1",
    "upstash-search>=0.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hh_mcp"]
