[project]
name = "hh-mcp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastmcp",
    "fastmcp[apps]>=4.0.11",
    "httpx2[http2]>=0.0.1",
    "markitdown>=0.1",
    "playwright>=1.63.0",
    "prefab-ui>=0.20.2",
    "pydantic>=2.7",
    "upstash-search>=0.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hh_mcp"]
